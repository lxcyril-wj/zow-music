<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' zow-media: data:; media-src zow-media:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>ZOW 燥作 · 你的私人音乐创作电台</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="sidebar"><div class="brand">zow<span>燥作</span><small data-t="brandDescription">你的私人音乐创作电台</small><p class="brand-slogan" data-t="brandSlogan">下一首，此刻为你而生。</p></div><p class="caption" data-t="space">我的空间</p><nav><button data-view="all" data-t="library">◉ 音乐库</button><button id="infinite-radio" type="button" data-view="radio" data-t="radio">◌ 无限电台</button><button data-view="favorites" data-t="favorites">♡ 我的喜欢</button><button data-view="studio" data-t="studio">✧ AI 音乐助手</button><button data-view="tasks" data-t="tasks">≋ 后台任务</button></nav><div class="list-head"><span data-t="playlists">播放列表</span><button id="new-list" title="New playlist">＋</button></div><nav id="playlists"></nav><div class="side-bottom"><div class="sidebar-tools"><button data-view="settings" id="settings-entry" type="button" aria-label="设置"></button><button id="theme-toggle" type="button" data-view="skins" aria-label="皮肤"></button><button id="about-author" type="button" aria-label="关于作者"></button></div></div></aside>
<div class="workspace"><header><span id="breadcrumb">音乐库</span><div><input id="search" type="search" placeholder="搜索歌曲 / Search"></div></header><main id="main"></main></div>
<aside class="now"><div class="caption">NOW PLAYING <span class="live-dot"></span></div><div id="art" class="art"><img id="cover" alt=""><span class="placeholder">zow<span>下一首，此刻为你而生。</span></span></div><div class="now-title"><div><h2 id="song-title" data-brand-empty>下一首，此刻为你而生。</h2><p id="artist">ZOW MUSIC</p></div><button id="like">♡</button></div><div class="spectrum-head"><span data-t="spectrum">音乐频谱</span><button id="spectrum-toggle">ON</button></div><canvas id="spectrum" width="600" height="110"></canvas><div class="lyrics-head"><span data-t="lyrics">歌词</span><span id="timing-status" class="badge"></span><button id="edit-lyrics" title="Edit lyrics">✎</button></div><div id="lyrics"><p class="muted" data-t="choose">选择一首歌，开始聆听。</p></div></aside>
<footer><div class="mini"><span class="mini-mark">z.</span><div><strong id="mini-title">ZOW 燥作</strong><small id="mini-sub">下一首，此刻为你而生。</small></div></div><div class="transport"><div class="buttons"><button id="shuffle" title="Shuffle">⤨</button><button id="prev" title="Previous">❮</button><button id="play" class="play" title="Play / Pause">▶</button><button id="next" title="Next">❯</button><button id="repeat" title="Repeat">↻</button></div><div id="playback-mode" class="playback-mode" role="status"></div><div class="progress"><span id="elapsed">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="volume"><button id="mute" type="button" title="静音"></button><input id="volume" type="range" min="0" max="100" value="75"><span id="volume-value" class="volume-value">75%</span></div></footer>
<dialog id="modal" aria-labelledby="modal-title"><form method="dialog"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="dialog-actions"><button type="button" value="cancel" data-t="cancel">取消</button><button id="modal-ok" class="accent" value="ok" data-t="save">保存</button></div></form></dialog><div id="toast" role="status"></div><audio id="audio" preload="metadata" crossorigin="anonymous"></audio><script type="module" src="app.js"></script></body></html>
